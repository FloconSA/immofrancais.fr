# Configuration de mise en ligne Netlify
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Les fichiers du dossier assets ont un nom unique à chaque version :
# le navigateur peut les garder en cache très longtemps.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
